name = "chanfana-openapi-template"
main = "src/index.ts"
compatibility_date = "2024-11-30"

compatibility_flags = ["nodejs_compat"]

# Enable TCP Sockets API for SMTP
[experimental]
tcp = true

# Enable source map uploads
upload_source_maps = true

# Observability block must be a TOML table
[observability]
enabled = true

# Environment variables for Gmail SMTP
[vars]
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_USERNAME = "franchmaverickk@gmail.com"
SMTP_SECURE = "false"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "openapi-template-db"
database_id = "c3c2a79e-1221-40c8-bb0d-5d0dd1d46a67"
